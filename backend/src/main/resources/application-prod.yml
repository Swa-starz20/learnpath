# ╔══════════════════════════════════════════════════════╗
# ║  LearnPath Backend — Production Profile Config      ║
# ║  Activated by: SPRING_PROFILES_ACTIVE=prod          ║
# ╚══════════════════════════════════════════════════════╝

spring:
  config:
    activate:
      on-profile: prod

  # ── Datasource ───────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/learnpath_db         # REQUIRED — jdbc:postgresql://host:5432/learnpath_db
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: LearnPath-Prod-Pool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

# ── JWT ──────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}                   # REQUIRED — min 256-bit random key
  access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}

# ── Server ───────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html
    min-response-size: 1024
  http2:
    enabled: true

# ── Security headers ─────────────────────────────────────────────────────────
# Applied via SecurityHeadersFilter (configured in SecurityConfig)
# X-Content-Type-Options: nosniff
# X-Frame-Options: DENY
# Strict-Transport-Security: max-age=31536000; includeSubDomains

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health   # Only health in production — no info
  endpoint:
    health:
      show-details: never

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    root: WARN
    com.learnpath: WARN
    org.springframework.security: WARN
    org.flywaydb: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
