# ╔══════════════════════════════════════════════════════╗
# ║  LearnPath Backend — Development Profile Config     ║
# ║  Activated by: SPRING_PROFILES_ACTIVE=dev           ║
# ╚══════════════════════════════════════════════════════╝

spring:
  config:
    activate:
      on-profile: dev

  # ── Datasource ───────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/learnpath_db
    username: learnpath_user
    password: ${DB_PASSWORD:learnpath_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: LearnPath-Dev-Pool
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA dev overrides ────────────────────────────────────────────────────────
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ── JWT dev defaults (override with env var in real dev) ─────────────────────
jwt:
  secret: ${JWT_SECRET:devSecretKey-MUST-be-at-least-32-characters-long-for-HS256-compliance}
  access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:60}  # Longer for convenience in dev

# ── CORS ─────────────────────────────────────────────────────────────────────
cors:
  allowed-origins: "http://localhost:5173,http://localhost:3000"

# ── Logging verbose ───────────────────────────────────────────────────────────
logging:
  level:
    com.learnpath: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG
