spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/learnpath_dev
    username: postgres
    password: password
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.learnpath: DEBUG
    org.springframework.security: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
