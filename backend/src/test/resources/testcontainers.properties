# ============================================================
#  Testcontainers configuration for LearnPath test suite
# ============================================================
#
# RYUK DISABLED — Windows Docker Desktop Issue
# ---------------------------------------------------
# Ryuk is Testcontainers' resource reaper daemon that
# removes orphaned containers. On Windows with Docker Desktop
# using the NPipe socket, Ryuk's internal port-binding health
# check reliably times out within 5 seconds because:
#   - Windows NPipe forwarding adds latency
#   - Ryuk's exposed port (8080) can conflict on Docker Desktop
#   - The Awaitility predicate check window is too short
#
# With Ryuk disabled, Testcontainers will not spin up the
# ryuk sidecar. Containers started during tests are still
# removed correctly because Spring Boot + JUnit 5 lifecycle
# hooks (@AfterAll) handle container.stop() cleanup.
#
# Reference: https://java.testcontainers.org/features/configuration/
# ============================================================
testcontainers.ryuk.disabled=true
