# ============================================================
#  LearnPath Backend — Test Profile Config
#  Activated by: @ActiveProfiles("test")
#  Database is injected by Testcontainers DynamicPropertySource
# ============================================================

spring:
  config:
    activate:
      on-profile: test

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.learnpath: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: INFO
