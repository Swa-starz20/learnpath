# ============================================================
#  LearnPath Backend — Docker Compose (Development)
#  Services: learnpath-db (PostgreSQL 18), learnpath-backend
# ============================================================
# Usage:
#   cp .env.example .env          # fill in secrets
#   docker compose up -d          # start both services
#   docker compose logs -f        # follow logs
#   docker compose down -v        # stop + remove volumes
# ============================================================

services:

  # ── PostgreSQL 18 ────────────────────────────────────────────────────────────
  learnpath-db:
    image: postgres:16-alpine     # Use postgres:16 until official pg18 image stable
    container_name: learnpath-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: learnpath_db
      POSTGRES_USER: learnpath_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"               # Exposed for local tooling (DBeaver, psql, pgAdmin)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnpath_user -d learnpath_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - learnpath-network

  # ── Spring Boot Backend ───────────────────────────────────────────────────────
  learnpath-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learnpath-backend
    restart: unless-stopped
    depends_on:
      learnpath-db:
        condition: service_healthy  # Wait for Postgres to be ready before starting
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://learnpath-db:5432/learnpath_db
      SPRING_DATASOURCE_USERNAME: learnpath_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    networks:
      - learnpath-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ── Persistent Volumes ────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  learnpath-network:
    driver: bridge
